<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Submit a product review using this WDD 131 form. Rate a product, choose installation date, select useful features, and leave your comments.">
    <meta name="author" content="Mulopwe Banze Billy">

    <title>Product Review | WDD 131</title>

    <link rel="stylesheet" href="styles/form.css">
    <link rel="stylesheet" href="styles/form-large.css">

    <script src="scripts/form.js" defer></script>
</head>
<body>

<header>
    <h1>Product Review Form</h1>
</header>

<main>

    <form action="review.html" method="get" class="my-form">

        <!--the Product Name -->
        <label for="product">
            Product Name <span>*</span>
        </label>

        <select id="product" name="product" required>
            <option value="" selected disabled>Select a Product ...</option>
        </select>

        <!-- the Overall Rating -->
        <fieldset>

            <legend>Overall Rating <span>*</span></legend>

            <label for="star1">
                <input
                    type="radio"
                    id="star1"
                    name="rating"
                    value="1"
                    required>
                ☆
            </label>

            <label for="star2">
                <input
                    type="radio"
                    id="star2"
                    name="rating"
                    value="2"
                    required>

                ☆☆
            </label>

            <label for="star3">
                <input
                    type="radio"
                    id="star3"
                    name="rating"
                    value="3"
                    required>
                ☆☆☆
            </label>

            <label for="star4">
                <input
                    type="radio"
                    id="star4"
                    name="rating"
                    value="4"
                    required>
                ☆☆☆☆
            </label>

            <label for="star5">
                <input
                    type="radio"
                    id="star5"
                    name="rating"
                    value="5"
                    required>
                ☆☆☆☆☆
            </label>

        </fieldset>

        <!--the Installation Date -->

        <label for="installDate">
            Date of Installation <span>*</span>
        </label>

        <input
            type="date"
            id="installDate"
            name="installDate"
            required>

        <!--the Useful Features -->

        <fieldset>

            <legend>Useful Features (Check all that apply)</legend>

            <label for="durability">
                <input
                    type="checkbox"
                    id="durability"
                    name="features"
                    value="Durability">
                Durability
            </label>

            <label for="ease">
                <input
                    type="checkbox"
                    id="ease"
                    name="features"
                    value="Ease of Use">
                Ease of Use
            </label>

            <label for="performance">
                <input
                    type="checkbox"
                    id="performance"
                    name="features"
                    value="Performance">
                Performance
            </label>

            <label for="design">
                <input
                    type="checkbox"
                    id="design"
                    name="features"
                    value="Design">
                Design
            </label>

        </fieldset>

        <!-- Written Review -->

        <label for="review">
            Written Review (Optional)
        </label>

        <textarea
            id="review"
            name="review"
            rows="6"
            placeholder="Tell us what you think about the product..."></textarea>

        <!-- User Name -->

        <label for="username">
            Your Name (Optional)
        </label>

        <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter your name">

        <!-- Submit -->

        <input
            type="submit"
            value="Post Review">

    </form>

</main>

<footer>

    <p>
        &copy;
        <span id="currentYear"></span>
         Mulopwe Banze Billy  South Africa
    </p>

    <p id="lastModified"></p>

</footer>

</body>
</html>
