<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms validation and best practice</title>
    <link rel="stylesheet" href="form.css">
</head>
<body>
    
    <main>
        <h1>Course Proposal Application</h1>

        <form action="thanks.html" method="get" class="wf1">

            <fieldset class="grid">
                <legend>Application Information</legend>
                <label for="firstName">First Name * <input type="text" name="firstName" id="firstName" autocomplete="given-name" required></label>

                <label for="lastName">Last Name * <input type="text" name="lastName" id="lastName" autocomplete="family-name" required></label>

                <label for="phone">Phone Number <input type="tel" name="phone" id="phone" autocomplete="tel" placeholder="+27 82 123 4567" pattern="[0-9+\-\s]{8,20}"></label>

                <label for="email">Email Address * <input type="email" name="email" id="email" autocomplete="email" placeholder="john@example.com" required></label>

                <label for="website">Website <input type="url" name="website" id="website" autocomplete="url" placeholder="https://example.com"></label>

            </fieldset>

            <fieldset class="">
                <legend>Course Information</legend>
                <div>Audience</div>
                <label for="beginner"><input type="radio" name="audience" id="beginner" value="Beginner" required> Beginner</label>
                <label for="intermediate"><input type="radio" name="audience" id="intermediate" value="Intermediate"> Intermediate</label>
                <label for="advanced"><input type="radio" name="audience" id="advanced" value="Advanced"> Advanced</label>

                <div>Software Needed</div>
                <label for="photoEditing"><input type="checkbox" name="software" id="photoEditing" value="Photo Editing"> Photo Editing</label>

                <label for="coding"><input type="checkbox" name="software" id="coding" value="Coding"> Coding</label>

                <label for="preprocessor"><input type="checkbox" name="software" id="preprocessor" value="CSS Preprocessor"> CSS Preprocessor</label>

                <label for="ftpClient"><input type="checkbox" name="software" id="ftpClient" value="FTP Client"> FTP Client</label>
            </fieldset>


            <fieldset class="grid">
                <legend>Funding</legend>
                
            <label for="completionDate">Anticipated Completion Date <input type="date" name="completionDate" id="completionDate"></label>

            <label for="completionTime">Anticipated Completion Time <input type="time" name="completionTime" id="completionTime"></label>
                            
            <label for="subject">Course Subject
                <select name="subject" id="subject" required>
                    <option value="" selected disabled>Select a Subject</option>
                    <option value="software-development">Software Development</option>
                    <option value="information-technology">Information Technology</option>
                    <option value="cyber-security">Cyber Security</option>
                    <option value="data-science">Data Science</option>
                    <option value="creative-professional">Creative Professional</option>
                    <option value="construction">Construction</option>
                    <option value="manufacturing">Manufacturing</option>
                </select>
            </label>

            <label for="authors">Number of Authors <input type="number" name="authors" id="authors" min="1" max="50" step="1" placeholder="1"></label>
           
                
            </fieldset>
            <button type="submit">
                Propose My Course
            </button>
        </form>
    </main>
</body>
</html>
